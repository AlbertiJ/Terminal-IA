name: Compilar APK Debug y Pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build_and_test:
    name: Pruebas unitarias y APK Debug
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Preparar debug.keystore (opcional DEBUG_KEYSTORE_BASE64)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
            echo "debug.keystore restaurado desde el secreto opcional DEBUG_KEYSTORE_BASE64."
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "debug.keystore generado automáticamente para esta compilación."
          else
            echo "Usando debug.keystore existente."
          fi

      - name: Ejecutar pruebas unitarias y compilar APK Debug
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Subir artefacto APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: terminal-ia-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Subir reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

  publish_release:
    name: Publicar APK en GitHub Releases
    needs: build_and_test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar APK compilado
        uses: actions/download-artifact@v4
        with:
          name: terminal-ia-debug-apk
          path: release-artifacts

      - name: Preparar archivo de release y checksum real
        id: pkg
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK_FILE="release-artifacts/Terminal-IA-${TAG}-debug.apk"
          cp release-artifacts/app-debug.apk "$APK_FILE"
          sha256sum "$APK_FILE" > "${APK_FILE}.sha256"
          echo "apk_file=$APK_FILE" >> "$GITHUB_OUTPUT"
          echo "sha_file=${APK_FILE}.sha256" >> "$GITHUB_OUTPUT"

      - name: Crear o actualizar Release en GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_FILE: ${{ steps.pkg.outputs.apk_file }}
          SHA_FILE: ${{ steps.pkg.outputs.sha_file }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_FILE" "$SHA_FILE" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK_FILE" "$SHA_FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Terminal-IA $TAG" \
              --generate-notes
          fi
